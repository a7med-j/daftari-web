name: Web app (GitHub Pages)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts parse
        # As ES modules (as the browser loads them), so an error like a name declared twice is caught.
        run: for f in app.js render.js standalone.js config.js; do cp "$f" "/tmp/${f%.js}.mjs" && node --check "/tmp/${f%.js}.mjs" || exit 1; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
